# Streamlit config for the educator screening app.
# Strips Streamlit's default chrome so the app reads as the project's own tool.

[client]
# "viewer" keeps the end-user menu — Settings (theme / wide-mode preferences),
# Print, and the custom About / Get help items (set via menu_items in app.py) —
# while hiding the developer options and the Deploy button.
toolbarMode = "viewer"

[browser]
# Do not send usage telemetry to Streamlit.
gatherUsageStats = false
